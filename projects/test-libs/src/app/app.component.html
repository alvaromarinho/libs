<ng-bs-modal-service />
<ng-bs-toast-service [theme]="darkMode() ? 'bootstrap-dark' : 'bootstrap'" />

<!-- Navbar mobile -->
<nav class="navbar navbar-dark bg-dark d-md-none">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-shield-fill-check"></i>
            Angular Libs
        </a>
        <button type="button" class="btn btn-sm btn-outline-light me-2" (click)="toggleDarkMode()" title="Alternar tema Bootstrap">
            <i class="bi" [ngClass]="darkMode() ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
        </button>
        <button class="navbar-toggler" type="button" (click)="toggleNav.set(!toggleNav())">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
    <ng-collapse [toggle]="toggleNav()">
        <ul class="navbar-nav px-2 pb-2">
            @for (nav of navItems; track nav.path) {
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2 w-100" [routerLink]="nav.path" routerLinkActive="active"
                        (click)="toggleNav.set(false)">
                        <i class="bi {{ nav.icon }}"></i> {{ nav.label }}
                    </a>
                </li>
            }
        </ul>
    </ng-collapse>
</nav>

<div class="row g-0 app-shell">
    <!-- Sidebar desktop -->
    <div class="d-none d-md-flex col-md-3 col-lg-2 shadow-sm flex-column sidebar">
        <div class="sidebar-brand text-center p-3">
            <img class="my-2" height="64" src="/assets/angular.png" alt="Angular">
            <h1 class="fs-5 fw-semibold mb-0">Alvaro Marinho</h1>
            <h2 class="fs-6 fw-light text-muted mb-2">Angular Libs</h2>
            <a class="btn btn-sm btn-outline-secondary rounded-pill px-3" href="https://github.com/alvaromarinho/libs" target="_blank">
                <i class="bi bi-github me-1"></i> GitHub
            </a>
        </div>
        <nav class="sidebar-nav nav flex-column flex-grow-1 py-2">
            @for (nav of navItems; track nav.path) {
            <a class="nav-link sidebar-link d-flex align-items-center gap-2" [routerLink]="nav.path" routerLinkActive="active">
                <i class="bi {{ nav.icon }}"></i>
                <span>{{ nav.label }}</span>
            </a>
            }
        </nav>
        <div class="sidebar-footer text-center small p-2 border-top">
            <div class="form-check form-switch d-inline-flex align-items-center gap-2 mb-1">
                <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch" [checked]="darkMode()"
                    (change)="toggleDarkMode()">
                <label class="form-check-label" for="darkModeSwitch">
                    <i class="bi" [ngClass]="darkMode() ? 'bi-moon-stars-fill' : 'bi-sun-fill'"></i>
                    Bootstrap dark mode
                </label>
            </div>
        </div>
    </div>

    <div class="col-12 col-md-9 col-lg-10 d-flex flex-column h-100 overflow-auto content-scroll p-3">
        <div class="content-panel shadow-sm flex-grow-1">
            <router-outlet />
        </div>
    </div>
</div>
