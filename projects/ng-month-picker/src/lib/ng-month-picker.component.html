<button type="button" class="btn btn-sm btn-light text-nowrap w-100" (click)="toggle($event)">
    {{ displayLabel }}
</button>

@if (showPicker) {
    <div class="month-picker-dropdown" (click)="$event.stopPropagation()">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <button type="button" class="btn btn-sm btn-link link-secondary p-1" (click)="pickerYear = pickerYear - 1">
                <i class="bi bi-chevron-left"></i>
            </button>
            <span class="fw-semibold">{{ pickerYear }}</span>
            <button type="button" class="btn btn-sm btn-link link-secondary p-1" (click)="pickerYear = pickerYear + 1">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
        <div class="month-picker-grid">
            @for (m of monthNames; track m; let i = $index) {
                <button type="button" class="btn btn-sm month-picker-btn"
                    [class.btn-primary]="isSelected(i)" [class.btn-light]="!isSelected(i)" (click)="select(i)">
                    {{ m }}
                </button>
            }
        </div>
    </div>
}
